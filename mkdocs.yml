site_name: muscat-db
site_url: https://muscat-team.github.io/muscatdb/
repo_url: https://github.com/muscat-team/muscatdb
repo_name: muscat-team/muscatdb
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          theme:
            palette:
              - scheme: default
                toggle:
                  icon: material/weather-night
                  name: ダークモードに切り替える
              - scheme: slate
                toggle:
                  icon: material/weather-sunny
                  name: ライトモードに切り替える
          nav_translations:
            Home: ホーム
            Using muscat-db: 使い方
            Getting started: はじめに
            Signing in and access: ログインと閲覧権限
            Browse a night: 一晩の観測を確認する
            Scheduling LCO observations: LCO の観測予約
            Exposure magnitude lookup: 露出計算と等級の取得
            Science: 科学解析
            Tech stack: 技術構成
            Running the system: システムの運用
nav:
  - Home: index.md
  - Using muscat-db:
      - Getting started: using/getting-started.md
      - Signing in and access: using/signing-in.md
      - Browse a night: using/browse-a-night.md
      - Scheduling LCO observations: using/lco-scheduling.md
      - Exposure magnitude lookup: exposure.md
  - Science: science.md
  - Tech stack: tech-stack.md
  - Running the system: running.md
validation:
  links:
    absolute_links: ignore
