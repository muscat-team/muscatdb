# Owner repositories and full commits only. Environment names include the
# revision: create a new environment for upgrades rather than changing one
# while workers may still be using it.
[engines.prose]
repository = "https://github.com/jpdeleon/prose2"
# Release v3.5.3, including native-unit saturation thresholds and config
# matching (jpdeleon/prose2#49), plus per-band shared-reference screening (jpdeleon/prose2#51).
commit = "714b4071b8b329d113a6a3ae2d0aeb788ed5fc72"
environment = "prose-prod-714b4071"
source_environment = "prose"
module = "prose"
# Frozen instrument definitions include the MuSCAT3/4 camera-ID aliases.
frozen_config_sha256 = "4f6701ae520755f487888c4ea95da92edddc3650b250ee4f47a88722edf796e0"
# The working editable metadata predates prose2's matplotlib<3.9 requirement.
# Pin the newest compatible 3.8 release rather than bypassing pip check.
[engines.prose.dependency_overrides]
matplotlib = "3.8.4"

[engines.timer]
repository = "https://github.com/john-livingston/timer"
commit = "b8428258c9b62266532173af4abd7fbafee6dcef"
environment = "timer-prod-b8428258"
source_environment = "timer"
module = "timer"

[engines.harmonic]
repository = "https://github.com/john-livingston/harmonic"
commit = "a32fb8e32ca776e0e6e7dc92ad4232cef1f12194"
environment = "harmonic-prod-a32fb8e3"
source_environment = "harmonic"
module = "harmonic"
