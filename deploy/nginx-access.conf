# nginx listener for Cloudflare Access (issue #50). NOT enabled by default.
#
# `cloudflared` (outbound tunnel, a system unit under an unprivileged user)
# points its ingress at http://127.0.0.1:8010. This listener has no HTTP Basic
# Auth: identity comes from the Access JWT, which the app validates through
# auth_request (nginx here has no njs/lua). Do not put Access and Basic Auth on
# the same hostname; the SSH `-L` + htpasswd listener in nginx.conf (:8000)
# stays as it is for people with a ut2 account.
#
# Requires MUSCAT_CF_TEAM_DOMAIN and MUSCAT_CF_AUD in the app environment,
# and a users row per collaborator (`muscat-db htpasswd set-email <user> <email>`).
# An email with no row, or any token that fails validation, never reaches the app.
#
# Install: sudo ln -sf $PWD/deploy/nginx-access.conf /etc/nginx/sites-available/muscat-db-access
#          sudo ln -sf /etc/nginx/sites-available/muscat-db-access /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

# Per-request attribution. Every request on this listener arrives from
# cloudflared on loopback, so $remote_addr is always 127.0.0.1: log the email
# the app validated and the client address Cloudflare reports instead. A
# request that fails Access validation logs an empty email. log_format must
# sit at http level, which is where sites-enabled files are included.
log_format muscat_access '$time_iso8601 "$cf_email" $http_cf_connecting_ip '
                         '$request_method "$request_uri" $status $body_bytes_sent $request_time';

server {
    listen 127.0.0.1:8010;

    access_log /var/log/nginx/muscat-db-access.log muscat_access;

    client_max_body_size 20m;

    # Security headers (#273), `always` so a refused auth_request carries them
    # too. Server level only: a location with its own add_header would drop
    # all of these. HSTS is safe here because Cloudflare always serves this
    # hostname over HTTPS.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Subrequest target. Internal, so a client cannot call it; the app also
    # insists on the loopback peer plus the shared secret.
    location = /_auth/cf {
        internal;
        proxy_pass http://127.0.0.1:8001/_auth/cf;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # The JWT is passed through; nothing a client sent as an identity is.
        proxy_set_header X-Forwarded-User "";
        include /etc/nginx/muscat-db-proxy-secret.conf;
        proxy_set_header Host $http_host;
    }

    location / {
        auth_request /_auth/cf;
        # Verified email from the subrequest. Any client-supplied
        # X-Forwarded-User is overwritten, never forwarded.
        auth_request_set $cf_email $upstream_http_x_auth_email;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Forwarded-User $cf_email;
        include /etc/nginx/muscat-db-proxy-secret.conf;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # cloudflared reaches this listener over plain HTTP, so $scheme is "http"
        # while the browser is on https://. Socket.IO checks Origin against it.
        proxy_set_header X-Forwarded-Proto https;

        # Live log streaming and SSE.
        proxy_buffering off;
        proxy_cache off;
    }

    location /socket.io {
        auth_request /_auth/cf;
        auth_request_set $cf_email $upstream_http_x_auth_email;

        proxy_pass http://127.0.0.1:8001/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-User $cf_email;
        include /etc/nginx/muscat-db-proxy-secret.conf;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
