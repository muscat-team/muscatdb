# nginx configuration for muscat-db STAGING reverse proxy with HTTP Basic Auth.
#
# Shares the same htpasswd and proxy-secret files as production, so the exact
# same users can reach staging with their existing credentials, and nginx's
# X-MuSCAT-Proxy-Secret authenticates uvicorn :8003 just as it does :8001.
# Public HTTPS entry is via an SSH tunnel to localhost:8002 -> nginx -> uvicorn :8003.
#
# Install: sudo cp deploy/nginx-staging.conf /etc/nginx/sites-available/muscat-db-staging
#          sudo ln -sf /etc/nginx/sites-available/muscat-db-staging /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:8002;

    auth_basic           "MuSCAT-db staging";
    auth_basic_user_file /etc/nginx/.htpasswd-muscatdb;

    # Same ceiling as production: the frontend trims large LCO payloads, but
    # raising nginx's 1m default prevents early rejection of big batches.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8003;

        # Forward the authenticated username to the backend.
        proxy_set_header X-Forwarded-User $remote_user;
        # Same shared secret as production: authenticates nginx to uvicorn so
        # local accounts cannot bypass HTTP Basic Auth via 127.0.0.1:8003.
        include /etc/nginx/muscat-db-proxy-secret.conf;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:8003/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;

        proxy_set_header X-Forwarded-User $remote_user;
        include /etc/nginx/muscat-db-proxy-secret.conf;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
