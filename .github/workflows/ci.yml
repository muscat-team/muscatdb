name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run ruff
        run: uv run ruff check --output-format=github .
      # The pytest jobs run browser and non-browser tests as two invocations
      # (scripts/ci_pytest.py). This fails if a test falls into neither, or both.
      - name: Check the browser/non-browser test split
        run: uv run python scripts/ci_pytest.py check-split

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --dev
      - name: Download catalog CSVs
        run: bash scripts/download_catalogs.sh
      # Headless Chromium for the browser tests (tests/browser/ and tests/*_browser.py). They skip
      # without it locally; MUSCAT_REQUIRE_BROWSER=1 below makes a missing or
      # broken install fail here instead of silently dropping that coverage.
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium-headless-shell
      # Non-browser tests at -n auto, then browser tests at -n 2 --dist loadfile
      # (#365): under -n auto the browser tests competed with the unit tests
      # and flaked on slow requests. Both invocations always run.
      - name: Run fast test suite
        env:
          MUSCAT_REQUIRE_BROWSER: "1"
          MUSCAT_BROWSER_ARTIFACTS: browser-artifacts
        run: uv run python scripts/ci_pytest.py run
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces-py${{ matrix.python-version }}
          path: browser-artifacts/
          if-no-files-found: ignore
          # Traces record request headers and the repository is public.
          retention-days: 7

  test-postgres:
    name: pytest (postgres control plane)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muscatdb
          POSTGRES_PASSWORD: muscatdb
          POSTGRES_DB: muscatdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muscatdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (with cluster extra)
        run: uv sync --dev --extra cluster
      # tests/test_job_store_postgres.py skips cleanly (never fails) when
      # MUSCAT_POSTGRES_DSN is unset/unreachable -- see that file's docstring.
      # This job is what actually exercises it; the `test`/`coverage` jobs
      # above run the same file too, but always hit the skip path since they
      # don't set MUSCAT_POSTGRES_DSN.
      - name: Run PostgreSQL-backed job store tests
        env:
          MUSCAT_POSTGRES_DSN: postgresql://muscatdb:muscatdb@localhost:5432/muscatdb_test
        run: uv run pytest tests/test_job_store_postgres.py tests/test_lco_queue_postgres.py tests/test_lco_rate_postgres.py --tb=short -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Download catalog CSVs
        run: bash scripts/download_catalogs.sh
      # Headless Chromium for the browser tests (tests/browser/ and tests/*_browser.py). They skip
      # without it locally; MUSCAT_REQUIRE_BROWSER=1 below makes a missing or
      # broken install fail here instead of silently dropping that coverage.
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium-headless-shell
      # --cov-fail-under makes this a real gate. Without it the job passes as long
      # as the suite runs, so as a *required* status check it looked like a
      # guardrail while enforcing nothing. The floor is a ratchet, set just below
      # the current level (CI ~69%, local ~68% -- they differ because some tests
      # skip without the external conda tools) so ordinary variance cannot fail a
      # PR. Raise it as coverage improves; the target is 80%.
      # The gate (scripts/ci_pytest.py COVERAGE_FLOOR) is applied once, to the
      # combined coverage of the non-browser and browser invocations.
      - name: Run tests with coverage
        env:
          MUSCAT_REQUIRE_BROWSER: "1"
          MUSCAT_BROWSER_ARTIFACTS: browser-artifacts
        run: uv run python scripts/ci_pytest.py run --cov --fail-under 68
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces-coverage
          path: browser-artifacts/
          if-no-files-found: ignore
          # Traces record request headers and the repository is public.
          retention-days: 7
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docs:
    name: mkdocs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --dev
      - name: Strict MkDocs build
        run: uv run mkdocs build --strict --site-dir "$HOME/temp/muscatdb-mkdocs-ci"
      - name: Compose test
        run: uv run pytest tests/test_docs_compose.py --tb=short -q
