name: Pages

# Builds and deploys the GitHub Pages site in GitHub Actions.
# Pages root is the MkDocs site; the UI snapshot is nested at site/home.
# On push to main, MkDocs builds site/, then build-static-site writes site/home/.

on:
  push:
    # main only. The github-pages environment permits deployments from `main`
    # and `pages`, so a push to `test` starts this job and the environment gate
    # refuses it seconds later with no steps run. Publishing from `test` would
    # also put unreleased documentation on the public site.
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Deploy Static Site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Download catalog CSVs
        run: bash scripts/download_catalogs.sh

      - name: Build MkDocs then nest the UI snapshot at site/home
        run: |
          uv run mkdocs build --site-dir site
          uv run python -c "from tests.test_static_site import _build_tiny_db; _build_tiny_db('mock_muscat.db')"
          uv run muscat-db build-static-site --out site/home --db mock_muscat.db --no-figures

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

